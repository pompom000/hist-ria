<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#111827'><title>Cálculo 1 • Estudo</title><style>
:root{--bg:#111827;--surface:#1f2937;--surface2:#273449;--text:#f8fafc;--muted:#aeb8ca;--line:#344156;--green:#58cc02;--greenDark:#328900;--purple:#7c5cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.55}header{position:sticky;top:0;z-index:20;background:#111827ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 14px}.head{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:18px}.sub{font-size:11px;color:var(--muted)}main{max-width:760px;margin:auto;padding:14px 12px 100px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:11px 0;box-shadow:0 8px 22px #0005}.hero{background:linear-gradient(145deg,#1f2937,#222a3d)}.module{display:flex;gap:12px;align-items:center}.icon{font-size:28px;width:52px;height:52px;border-radius:16px;background:#334155;display:grid;place-items:center;flex:none}h2{font-size:22px;margin:6px 0;line-height:1.2}h3{font-size:16px;margin:15px 0 7px;line-height:1.2}.tag{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:900;color:#9aa8c0}.muted{color:var(--muted);font-size:13px}.progress{height:9px;background:#374151;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--green);border-radius:99px;transition:.4s}button{font:inherit;border:0;border-radius:12px;padding:11px 14px;margin:4px 4px 4px 0;font-weight:800;cursor:pointer;background:var(--green);color:#102000;box-shadow:0 3px 0 var(--greenDark)}button:active{transform:translateY(2px);box-shadow:none}button.alt{background:#334155;color:#fff;box-shadow:0 3px 0 #1f2937}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#172033f5;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.nav button{background:transparent;box-shadow:none;color:#aeb8ca;font-size:10px;padding:5px 7px;margin:0;min-width:63px}.nav button.active{color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:var(--surface2);border:1px solid var(--line);padding:13px;border-radius:14px}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--muted)}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#111827;border:1px solid #374151;border-left:4px solid var(--purple);padding:12px;border-radius:10px;overflow:auto;margin:10px 0}.tip{background:#17351b;border:1px solid #2c6833;padding:12px;border-radius:12px;color:#c9f7cf;margin:12px 0}.option{display:block;width:100%;text-align:left;background:#273449;color:#fff;border:1px solid #3a475c;box-shadow:none}.option.correct{background:#173b1c;border-color:var(--green)}.option.wrong{background:#431b22;border-color:#ff4b4b}.flash{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;border-radius:18px;background:linear-gradient(145deg,#5141a8,#7c5cff);font-size:21px;font-weight:900;cursor:pointer}.flash small{display:block;color:#e7e2ff;font-size:11px;margin-top:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}@media(max-width:460px){.grid2{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class='head'><div><div class='brand'>📘 Cálculo 1</div><div class='sub'>Aprenda • pratique • revise</div></div><div>🌙</div></div></header><main id='app'></main><div class='nav'><button id='n-home' onclick="go('home')">🏠<br>Início</button><button id='n-lessons' onclick="go('lessons')">📚<br>Aulas</button><button id='n-quiz' onclick="go('quizmenu')">✏️<br>Praticar</button><button id='n-cards' onclick="go('cardsmenu')">🃏<br>Cartões</button><button id='n-progress' onclick="go('progress')">🏆<br>Progresso</button></div><script>
const modules=[{"title": "Conjuntos Numéricos", "icon": "🔢", "cat": "Fundamentos", "desc": "N, Z, Q, I, R, inclusão e classificação", "lesson": "<h3>O que são conjuntos numéricos?</h3><p>Organizam os números. Quando a questão pede o <b>menor conjunto</b>, escolha o conjunto mais específico.</p><div class=\"formula\">N ⊂ Z ⊂ Q ⊂ R &nbsp;&nbsp; e &nbsp;&nbsp; I ⊂ R</div><h3>① Naturais — N</h3><p>N={0,1,2,3,...}. São usados para contar.</p><h3>② Inteiros — Z</h3><p>Z={...,−3,−2,−1,0,1,2,3,...}.</p><h3>③ Racionais — Q</h3><p>Podem ser escritos como a/b, com a,b inteiros e b≠0. Exemplos: 1/2, −3/5, 4 e 0,25.</p><h3>④ Irracionais — I</h3><p>Não podem ser escritos como fração de inteiros. Exemplos: √2, √3 e π.</p><h3>⑤ Reais — R</h3><p>R=Q∪I.</p><div class=\"tip\">Ex.: −8→Z; −3/5→Q; √2→I; √25=5→N; π→I; 3,1415→Q.</div>"}, {"title": "Intervalos", "icon": "↔️", "cat": "Fundamentos", "desc": "Intervalos, desigualdades, união e interseção", "lesson": "<h3>Tipos</h3><div class=\"formula\">(a,b) → a&lt;x&lt;b<br>[a,b] → a≤x≤b<br>[a,b) → a≤x&lt;b<br>(a,b] → a&lt;x≤b</div><p>Parêntese: extremo não entra. Colchete: entra. No infinito usamos parênteses.</p><h3>Executando contas</h3><p>2x+4&gt;10 → 2x&gt;6 → x&gt;3 → <b>(3,+∞)</b>.</p><p>−3x&lt;9 → dividindo por −3, <b>inverta o sinal</b> → x&gt;−3.</p><h3>União e interseção</h3><p>∪ junta valores; ∩ mantém os comuns.</p><div class=\"formula\">[1,5] ∩ [3,7] = [3,5]</div><p>2&lt;x≤6 → <b>(2,6]</b>.</p>"}, {"title": "Função Constante e Identidade", "icon": "📈", "cat": "Funções", "desc": "Conceito de função, domínio, imagem e gráficos", "lesson": "<h3>Conceito</h3><p>Função relaciona cada entrada do domínio a uma única saída.</p><div class=\"formula\">y=f(x)</div><p><b>Domínio:</b> entradas permitidas. <b>Contradomínio:</b> conjunto de chegada. <b>Imagem:</b> saídas que realmente aparecem.</p><h3>Constante</h3><div class=\"formula\">f(x)=c</div><p>O resultado é sempre c; gráfico é reta horizontal.</p><h3>Identidade</h3><div class=\"formula\">f(x)=x</div><p>Entrada e saída são iguais; gráfico y=x.</p><h3>Valor da função</h3><p>f(x)=x+3 → f(2)=5. Substitua x pelo valor indicado.</p>"}, {"title": "Função Afim", "icon": "📏", "cat": "Funções", "desc": "f(x)=ax+b, raiz, crescimento e taxa de variação", "lesson": "<h3>Forma geral</h3><div class=\"formula\">f(x)=ax+b</div><p>a é coeficiente angular; b é coeficiente linear.</p><p>a&gt;0 → crescente; a&lt;0 → decrescente; a=0 → constante.</p><h3>Raiz</h3><div class=\"formula\">ax+b=0 → x=−b/a</div><p>Ex.: 2x−6=0 → x=3.</p><h3>Taxa de variação</h3><div class=\"formula\">a=(y₂−y₁)/(x₂−x₁)</div><p>Para o gráfico, use dois pontos ou a raiz e (0,b).</p>"}, {"title": "Função Linear", "icon": "➗", "cat": "Funções", "desc": "f(x)=ax, origem e proporcionalidade", "lesson": "<h3>Forma</h3><div class=\"formula\">f(x)=ax</div><p>É uma função afim com b=0 e passa pela origem.</p><p>Ex.: f(x)=3x → f(4)=12.</p><h3>Proporcionalidade</h3><p>Se y é diretamente proporcional a x, y=ax.</p>"}, {"title": "Função Quadrática", "icon": "⌒", "cat": "Funções", "desc": "Parábola, Δ, Bhaskara, vértice e concavidade", "lesson": "<h3>Forma</h3><div class=\"formula\">f(x)=ax²+bx+c, a≠0</div><p>a&gt;0 → concavidade para cima; a&lt;0 → para baixo.</p><h3>Discriminante</h3><div class=\"formula\">Δ=b²−4ac</div><p>Δ&gt;0: duas raízes; Δ=0: uma; Δ&lt;0: nenhuma raiz real.</p><h3>Bhaskara</h3><div class=\"formula\">x=(−b±√Δ)/(2a)</div><h3>Vértice</h3><div class=\"formula\">xᵥ=−b/(2a)<br>yᵥ=f(xᵥ)</div><p>Eixo de simetria: x=xᵥ. O vértice é máximo ou mínimo.</p>"}, {"title": "Função Exponencial", "icon": "⚡", "cat": "Funções", "desc": "Potências, crescimento, decaimento e equações", "lesson": "<h3>Forma</h3><div class=\"formula\">f(x)=aˣ, a&gt;0 e a≠1</div><p>a&gt;1 → crescente. 0&lt;a&lt;1 → decrescente.</p><h3>Potências</h3><div class=\"formula\">aᵐ·aⁿ=aᵐ⁺ⁿ<br>aᵐ/aⁿ=aᵐ⁻ⁿ<br>(aᵐ)ⁿ=aᵐⁿ<br>a⁰=1<br>a⁻ⁿ=1/aⁿ</div><p>2ˣ=2⁵ → x=5. Quando não der para igualar bases, logaritmos podem ajudar.</p>"}, {"title": "Função Logarítmica", "icon": "🧮", "cat": "Funções", "desc": "Definição, propriedades, domínio e mudança de base", "lesson": "<h3>Definição</h3><div class=\"formula\">logₐ(x)=y ⇔ aʸ=x</div><p>a&gt;0, a≠1 e x&gt;0.</p><p>log₂(8)=3 e log₁₀(1000)=3.</p><h3>Propriedades</h3><div class=\"formula\">logₐ(xy)=logₐx+logₐy<br>logₐ(x/y)=logₐx−logₐy<br>logₐ(xᵏ)=k·logₐx</div><div class=\"formula\">logₐ(1)=0<br>logₐ(a)=1</div><h3>Mudança de base</h3><div class=\"formula\">logₐ(b)=log_c(b)/log_c(a)</div><p>O argumento de um logaritmo precisa ser positivo.</p>"}, {"title": "Noções Intuitivas de Limite", "icon": "🎯", "cat": "Limites", "desc": "Aproximação, limites laterais, 0/0 e continuidade", "lesson": "<h3>Ideia</h3><p>Limite pergunta para qual valor f(x) se aproxima quando x se aproxima de a.</p><div class=\"formula\">lim(x→a) f(x)</div><p>Em função contínua, muitas vezes basta substituir: lim(x→3)(x+2)=5.</p><h3>Laterais</h3><div class=\"formula\">lim(x→a⁻) → esquerda<br>lim(x→a⁺) → direita</div><p>O limite existe quando os dois lados chegam ao mesmo valor.</p><h3>0/0</h3><p>É indeterminação, não resposta. Tente fatorar e simplificar.</p><div class=\"formula\">lim(x→2)(x²−4)/(x−2)=lim(x→2)(x+2)=4</div><p>Continuidade: intuitivamente, sem “quebra” e com limite igual ao valor no ponto.</p>"}, {"title": "Revisão Geral de Cálculo 1", "icon": "🏆", "cat": "Revisão", "desc": "Checklist e estratégia para provas", "lesson": "<h3>Checklist</h3><ol><li>N, Z, Q, I e R.</li><li>Intervalos e inequações.</li><li>Valores de funções.</li><li>Constante, identidade, afim e linear.</li><li>Δ, Bhaskara e vértice.</li><li>Potências e exponenciais.</li><li>Propriedades de logaritmos.</li><li>Limites, laterais e 0/0.</li></ol><h3>Estratégia</h3><p><b>1.</b> Identifique o assunto. <b>2.</b> Escreva a regra. <b>3.</b> Substitua. <b>4.</b> Resolva linha por linha. <b>5.</b> Confira domínio e sinais.</p>"}];
const questions=[{"subject": "Conjuntos Numéricos", "q": "Menor conjunto de −3/5?", "opts": ["Q", "Z", "I", "N"], "answer": 0}, {"subject": "Conjuntos Numéricos", "q": "Menor conjunto de √2?", "opts": ["I", "Q", "Z", "N"], "answer": 0}, {"subject": "Conjuntos Numéricos", "q": "√25 pertence a:", "opts": ["N", "Z", "Q", "I"], "answer": 0}, {"subject": "Conjuntos Numéricos", "q": "3,1415 é:", "opts": ["Racional", "Irracional", "Inteiro negativo", "Natural"], "answer": 0}, {"subject": "Intervalos", "q": "2x+4>10:", "opts": ["x>3", "x<3", "x≥3", "x≤3"], "answer": 0}, {"subject": "Intervalos", "q": "1≤x<5:", "opts": ["[1,5)", "(1,5)", "[1,5]", "(1,5]"], "answer": 0}, {"subject": "Intervalos", "q": "−3x<9:", "opts": ["x>−3", "x<−3", "x>3", "x<3"], "answer": 0}, {"subject": "Intervalos", "q": "[1,5] ∩ [3,7] =", "opts": ["[3,5]", "[1,7]", "[1,3]", "[5,7]"], "answer": 0}, {"subject": "Função Constante e Identidade", "q": "Função constante:", "opts": ["f(x)=c", "f(x)=x", "f(x)=ax+b", "f(x)=x²"], "answer": 0}, {"subject": "Função Constante e Identidade", "q": "Função identidade:", "opts": ["f(x)=x", "f(x)=c", "f(x)=ax", "f(x)=x²"], "answer": 0}, {"subject": "Função Afim", "q": "Raiz de 2x−6:", "opts": ["3", "−3", "6", "−6"], "answer": 0}, {"subject": "Função Afim", "q": "Coeficiente angular de −2x+5:", "opts": ["−2", "2", "5", "−5"], "answer": 0}, {"subject": "Função Linear", "q": "f(3) em f(x)=4x:", "opts": ["12", "7", "1", "4"], "answer": 0}, {"subject": "Função Linear", "q": "Função linear passa por:", "opts": ["(0,0)", "(1,0)", "(0,1)", "(1,1)"], "answer": 0}, {"subject": "Função Quadrática", "q": "Δ é:", "opts": ["b²−4ac", "b²+4ac", "2a+b", "−b/2a"], "answer": 0}, {"subject": "Função Quadrática", "q": "Se Δ<0:", "opts": ["nenhuma raiz real", "uma raiz", "duas raízes", "três raízes"], "answer": 0}, {"subject": "Função Quadrática", "q": "x do vértice:", "opts": ["−b/(2a)", "b/(2a)", "−c/a", "Δ/(2a)"], "answer": 0}, {"subject": "Função Exponencial", "q": "2³ =", "opts": ["8", "6", "9", "5"], "answer": 0}, {"subject": "Função Exponencial", "q": "Se a>1, aˣ é:", "opts": ["crescente", "decrescente", "constante", "negativa"], "answer": 0}, {"subject": "Função Exponencial", "q": "2ˣ=16:", "opts": ["4", "2", "8", "16"], "answer": 0}, {"subject": "Função Logarítmica", "q": "log₂(8) =", "opts": ["3", "2", "4", "8"], "answer": 0}, {"subject": "Função Logarítmica", "q": "log₁₀(1000) =", "opts": ["3", "2", "10", "100"], "answer": 0}, {"subject": "Função Logarítmica", "q": "Argumento de log deve ser:", "opts": ["positivo", "negativo", "zero", "qualquer real"], "answer": 0}, {"subject": "Noções Intuitivas de Limite", "q": "lim(x→3)(x+2) =", "opts": ["5", "3", "2", "6"], "answer": 0}, {"subject": "Noções Intuitivas de Limite", "q": "0/0 em limite é:", "opts": ["indeterminação", "zero", "infinito", "função inexistente"], "answer": 0}, {"subject": "Noções Intuitivas de Limite", "q": "Para limite existir, laterais devem:", "opts": ["ser iguais", "ser diferentes", "ser zero", "ser infinitas"], "answer": 0}];
const cards=[{"subject": "Conjuntos Numéricos", "front": "N ⊂ Z ⊂ Q ⊂ R", "back": "Os conjuntos estão encaixados nessa ordem."}, {"subject": "Conjuntos Numéricos", "front": "I ⊂ R", "back": "Irracionais são reais que não são racionais."}, {"subject": "Intervalos", "front": "(a,b)", "back": "Extremos não entram."}, {"subject": "Intervalos", "front": "[a,b]", "back": "Extremos entram."}, {"subject": "Intervalos", "front": "Dividiu por negativo? Inverte o sinal.", "back": "Regra essencial das inequações."}, {"subject": "Função Afim", "front": "f(x)=ax+b", "back": "a é angular; b é linear."}, {"subject": "Função Afim", "front": "x=−b/a", "back": "Raiz da função afim."}, {"subject": "Função Linear", "front": "f(x)=ax", "back": "Caso da afim com b=0; passa pela origem."}, {"subject": "Função Quadrática", "front": "Δ=b²−4ac", "back": "Determina a quantidade de raízes reais."}, {"subject": "Função Quadrática", "front": "x=(−b±√Δ)/(2a)", "back": "Fórmula de Bhaskara."}, {"subject": "Função Quadrática", "front": "xᵥ=−b/(2a)", "back": "Coordenada x do vértice."}, {"subject": "Função Exponencial", "front": "a>1 → crescente", "back": "Base maior que 1 produz crescimento."}, {"subject": "Função Exponencial", "front": "0<a<1 → decrescente", "back": "Base entre 0 e 1 produz decaimento."}, {"subject": "Função Logarítmica", "front": "logₐ(x)=y ⇔ aʸ=x", "back": "Logaritmo e exponencial são inversas."}, {"subject": "Função Logarítmica", "front": "logₐ(xy)=logₐx+logₐy", "back": "Produto vira soma."}, {"subject": "Função Logarítmica", "front": "logₐ(x/y)=logₐx−logₐy", "back": "Quociente vira subtração."}, {"subject": "Noções Intuitivas de Limite", "front": "lim(x→a)f(x)", "back": "Valor para o qual a função se aproxima."}, {"subject": "Noções Intuitivas de Limite", "front": "0/0 é indeterminação", "back": "Tente fatorar e simplificar."}, {"subject": "Função Constante e Identidade", "front": "f(x)=c", "back": "Saída sempre igual a c."}, {"subject": "Função Constante e Identidade", "front": "f(x)=x", "back": "Entrada e saída são iguais."}];
let state=JSON.parse(localStorage.getItem('calc1_state')||'{"done":[],"score":0,"streak":0}');
let quiz=[],quizSubject='Global',cardList=cards,cardIndex=0,cardSide=false;
function save(){localStorage.setItem('calc1_state',JSON.stringify(state))}
function currentRoute(){return location.hash.slice(1)||localStorage.getItem('calc1_route')||'home'}
function go(r){localStorage.setItem('calc1_route',r);if(location.hash.slice(1)!==r)location.hash=r;render(r);window.scrollTo(0,0)}
function route(){let r=currentRoute();localStorage.setItem('calc1_route',r);render(r)}
window.addEventListener('hashchange',route)
function nav(active){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));let x=document.getElementById('n-'+active);if(x)x.classList.add('active')}
function render(r){if(r.startsWith('lesson-'))lesson(+r.split('-')[1]);else if(r.startsWith('quiz-'))startQuiz(decodeURIComponent(r.slice(5)));else if(r==='quizmenu')quizMenu();else if(r==='cardsmenu')cardsMenu();else if(r.startsWith('cards-'))startCards(decodeURIComponent(r.slice(6)));else if(r==='lessons')lessons();else if(r==='progress')progress();else home()}
function home(){nav('home');let p=Math.round(state.done.length/modules.length*100);app.innerHTML=`<div class="card hero"><span class="tag">Seu caminho</span><h2>Vamos estudar Cálculo 1? ✨</h2><p class="muted">Aulas completas, prática e revisão em pequenas etapas.</p><div class="progress"><div class="bar" style="width:${p}%"></div></div><p class="muted"><b style="color:#fff">${p}%</b> concluído</p></div><div class="grid2"><div class="stat"><b>📚 ${modules.length}</b><span>módulos</span></div><div class="stat"><b>✏️ ${questions.length}</b><span>questões</span></div><div class="stat"><b>🃏 ${cards.length}</b><span>cartões</span></div><div class="stat"><b>🔥 ${state.streak||0}</b><span>sequência</span></div></div><div class="card"><span class="tag">Continue</span><h3>📖 Estudar</h3><p class="muted">O app salva a última tela visitada.</p><button onclick="go('lessons')">Continuar →</button><button class="alt" onclick="go('quizmenu')">Praticar</button></div>`}
function lessons(){nav('lessons');app.innerHTML=`<div class="card hero"><span class="tag">Trilha</span><h2>📚 Aulas</h2><p class="muted">Leia a matéria antes de praticar.</p></div>`+modules.map((m,i)=>`<div class="card"><div class="module"><div class="icon">${m.icon}</div><div><h3>${i+1}. ${m.title}</h3><div class="muted">${m.desc}</div></div></div><button onclick="go('lesson-${i}')">${state.done.includes(i)?'✓ Revisar':'Estudar'} →</button></div>`).join('')}
function lesson(i){nav('lessons');let m=modules[i];app.innerHTML=`<div class="card hero"><div class="module"><div class="icon">${m.icon}</div><div><span class="tag">${m.cat}</span><h2>${m.title}</h2><div class="muted">${m.desc}</div></div></div></div><div class="card">${m.lesson}</div><div class="card"><button onclick="finishLesson(${i})">${state.done.includes(i)?'✓ Concluído':'Marcar como concluído'}</button><button class="alt" onclick="go('quiz-${encodeURIComponent(m.title)}')">✏️ Praticar matéria</button><button class="alt" onclick="go('lessons')">← Aulas</button></div>`}
function finishLesson(i){if(!state.done.includes(i)){state.done.push(i);state.streak=(state.streak||0)+1;save()}lesson(i)}
function quizMenu(){nav('quiz');let subs=['Global',...modules.map(m=>m.title)];app.innerHTML=`<div class="card hero"><span class="tag">Treino</span><h2>✏️ Perguntas</h2><p class="muted">Escolha uma matéria ou misture todas.</p></div>`+subs.map((s,i)=>`<div class="card"><div class="module"><div class="icon">${i?'🧠':'🌐'}</div><div><h3>${s}</h3><div class="muted">${i?modules[i-1].desc:'Questões de todas as matérias'}</div></div></div><button onclick="go('quiz-${encodeURIComponent(s)}')">Começar →</button></div>`).join('')}
function startQuiz(subject){nav('quiz');quizSubject=subject;let pool=subject==='Global'?questions:questions.filter(q=>q.subject===subject);quiz=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(10,pool.length));app.innerHTML=`<div class="card hero"><span class="tag">${subject}</span><h2>🎯 Treino</h2></div>`+quiz.map((q,i)=>`<div class="card"><span class="tag">${q.subject}</span><h3>${i+1}. ${q.q}</h3>${q.opts.map((o,j)=>`<button class="option" onclick="answer(this,${i},${j})">${String.fromCharCode(65+j)}) ${o}</button>`).join('')}<div id="res-${i}" class="muted"></div></div>`).join('')+`<div class="card"><button onclick="go('quizmenu')">← Escolher matéria</button></div>`}
function answer(btn,i,j){let box=btn.parentElement;if(box.dataset.done)return;box.dataset.done='1';let q=quiz[i],ok=j===q.answer;box.querySelectorAll('.option').forEach((b,k)=>{if(k===q.answer)b.classList.add('correct')});if(!ok)btn.classList.add('wrong');document.getElementById('res-'+i).innerHTML=ok?'✅ Correto!':'❌ A resposta correta está destacada.';if(ok)state.score=(state.score||0)+1;save()}
function cardsMenu(){nav('cards');let subs=['Global',...modules.map(m=>m.title)];app.innerHTML=`<div class="card hero"><span class="tag">Memorização</span><h2>🃏 Cartões</h2><p class="muted">Regras e fórmulas de todas as matérias.</p></div>`+subs.map((s,i)=>`<div class="card"><div class="module"><div class="icon">${i?'🃏':'🌐'}</div><div><h3>${s}</h3><div class="muted">${i?'Regras e fórmulas':'Todas as regras'}</div></div></div><button onclick="go('cards-${encodeURIComponent(s)}')">Abrir →</button></div>`).join('')}
function startCards(subject){nav('cards');cardList=subject==='Global'?cards:cards.filter(c=>c.subject===subject);cardIndex=0;cardSide=false;drawCard(subject)}
function drawCard(subject){let c=cardList[cardIndex];app.innerHTML=`<div class="card hero"><span class="tag">Cartões • ${subject}</span><h2>🃏 Memorize</h2><p class="muted">Toque para virar.</p><div class="flash" onclick="flipCard()">${cardSide?c.back:c.front}<small>${cardSide?'Toque para ver a regra':'Toque para ver a explicação'}</small></div><p style="text-align:center" class="muted">${cardIndex+1} de ${cardList.length}</p><button onclick="prevCard()">←</button><button onclick="nextCard()">Próximo →</button><button class="alt" onclick="go('cardsmenu')">Escolher matéria</button></div>`}
function flipCard(){cardSide=!cardSide;drawCard(cardList[cardIndex].subject)}function nextCard(){cardIndex=(cardIndex+1)%cardList.length;cardSide=false;drawCard(cardList[cardIndex].subject)}function prevCard(){cardIndex=(cardIndex-1+cardList.length)%cardList.length;cardSide=false;drawCard(cardList[cardIndex].subject)}
function progress(){nav('progress');let p=Math.round(state.done.length/modules.length*100);app.innerHTML=`<div class="card hero"><span class="tag">Progresso</span><h2>🏆 ${p}% concluído</h2><div class="progress"><div class="bar" style="width:${p}%"></div></div></div><div class="grid2"><div class="stat"><b>${state.done.length}/${modules.length}</b><span>módulos</span></div><div class="stat"><b>${state.score}</b><span>acertos</span></div></div><div class="card"><h3>Trilha</h3>${modules.map((m,i)=>`<p>${state.done.includes(i)?'🟢':'⚪'} ${m.title}</p>`).join('')}</div><div class="card"><button class="alt" onclick="if(confirm('Zerar progresso?')){state={done:[],score:0,streak:0};save();progress()}">Zerar progresso</button></div>`}
route();
</script></body></html>
