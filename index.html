<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#58a700"><title>Cálculo 1 • Jornada</title>
<style>
:root{--bg:#f7f7f7;--s:#fff;--t:#292929;--m:#777;--g:#58a700;--gs:#e9f7d9;--b:#2f7de1;--y:#ffc800;--r:#e84c5b;--line:#e5e5e5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;line-height:1.45}body.dark{--bg:#11140f;--s:#1d211a;--t:#f1f4ec;--m:#a9b0a4;--gs:#27391c;--line:#30362c}header{position:sticky;top:0;z-index:5;background:var(--s);border-bottom:1px solid var(--line);padding:11px 14px}.top{max-width:760px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;color:var(--g);font-size:18px}.stats{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:800}.stat{padding:7px 9px;background:var(--bg);border:1px solid var(--line);border-radius:12px}.theme{border:0;background:var(--bg);color:var(--t);border-radius:12px;padding:7px;font-size:17px}main{max-width:760px;margin:auto;padding:14px 12px 95px}.card{background:var(--s);border:1px solid var(--line);border-radius:17px;padding:16px;margin:11px 0;box-shadow:0 3px 0 #ddd}.dark .card{box-shadow:0 3px 0 #0a0d08}.hero{background:linear-gradient(135deg,var(--s),var(--gs));padding:20px}h2{font-size:23px;margin:5px 0 8px}h3{margin:5px 0}.muted{color:var(--m)}.tag{font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:900;color:var(--g)}button{font:inherit;font-weight:800;border:0;border-radius:13px;padding:11px 15px;background:var(--g);color:#fff;cursor:pointer;margin:4px 3px 4px 0;box-shadow:0 3px 0 #3f7d05}button:active{transform:translateY(2px);box-shadow:none}button.alt{background:var(--bg);color:var(--t);border:1px solid var(--line);box-shadow:none}button.blue{background:var(--b);box-shadow:0 3px 0 #205aab}button.yellow{background:var(--y);color:#493800;box-shadow:0 3px 0 #b48b00}button.red{background:var(--r);box-shadow:0 3px 0 #a32d39}.progress{height:9px;background:#e6e6e6;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--g),#88d72a);border-radius:99px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:var(--s);border:1px solid var(--line);border-radius:15px;padding:13px}.metric b{display:block;font-size:20px}.path{display:flex;flex-direction:column;gap:8px;position:relative}.path:before{content:"";position:absolute;left:25px;top:25px;bottom:25px;width:4px;background:#d7ddd3;border-radius:9px}.node{display:flex;align-items:center;gap:10px;padding:7px;position:relative}.circle{width:50px;height:50px;flex:none;border-radius:50%;display:grid;place-items:center;background:#e5e8e2;border:4px solid var(--s);z-index:1;font-weight:900;color:#777}.node.active .circle{background:var(--g);color:#fff}.node.done .circle{background:var(--y);color:#493800}.node.locked{opacity:.45}.nodeinfo{flex:1;background:var(--s);border:1px solid var(--line);border-radius:14px;padding:9px 11px}.nodeinfo strong{display:block}.nodeinfo small{color:var(--m)}.option{display:block;width:100%;text-align:left;background:var(--bg);color:var(--t);border:1px solid var(--line);box-shadow:none}.correct{background:#e5f7d5!important;border-color:#9dd16b!important}.wrong{background:#ffe8eb!important;border-color:#efa5ae!important}.formula{background:var(--bg);border-left:4px solid var(--g);padding:11px;border-radius:8px;font-family:monospace;overflow:auto}.flash{min-height:170px;border-radius:18px;background:linear-gradient(135deg,#58a700,#8bd928);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;font-size:21px;font-weight:900;cursor:pointer}.flash small{font-size:11px;margin-top:12px;color:#efffdc}nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--s);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 3px}nav button{background:transparent;color:var(--m);box-shadow:none;padding:5px 5px;font-size:11px;margin:0}nav button:hover{color:var(--g)}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#292929;color:#fff;padding:10px 15px;border-radius:12px;z-index:20;font-weight:800}
</style></head><body>
<header><div class="top"><div class="logo">📘 Cálculo 1</div><div class="stats"><span class="stat">🔥 <span id="st">0</span></span><span class="stat">⭐ <span id="xp">0</span></span><span class="stat">❤️ <span id="hp">5</span></span><button class="theme" onclick="theme()" id="th">🌙</button></div></div></header>
<main id="app"></main><nav><button onclick="home()">🏠<br>Início</button><button onclick="lessons()">🗺️<br>Trilha</button><button onclick="practiceMenu()">✏️<br>Praticar</button><button onclick="cardsMenu()">🃏<br>Cartões</button><button onclick="progress()">📊<br>Progresso</button></nav>
<script>
const modules=[
{id:1,title:"Conjuntos Numéricos",desc:"N, Z, Q, I e R; classificação de números.",topics:["Naturais (N)","Inteiros (Z)","Racionais (Q)","Irracionais (I)","Reais (R)","Como encontrar o menor conjunto"],lesson:`<p>Os conjuntos numéricos organizam os números. Pense neles como caixas: alguns números pertencem a várias caixas, mas a questão pode pedir a <b>menor</b> caixa possível.</p>
<div class="formula">N ⊂ Z ⊂ Q ⊂ R<br>I ⊂ R</div>
<p><b>N:</b> 0, 1, 2, 3... (alguns livros começam em 1).<br><b>Z:</b> ..., −2, −1, 0, 1, 2...<br><b>Q:</b> números que podem ser escritos como a/b, com a,b inteiros e b≠0.<br><b>I:</b> não podem ser escritos como fração de inteiros, como √2 e π.<br><b>R:</b> reúne racionais e irracionais.</p>
<h3>Exemplo</h3><p>−8 é inteiro, então também é racional e real. O menor conjunto é <b>Z</b>.<br>−3/5 é racional: menor conjunto <b>Q</b>.<br>√2 é irracional: menor conjunto <b>I</b>.<br>√25 = 5: menor conjunto <b>N</b>.</p>`},
{id:2,title:"Intervalos",desc:"Representação, união, interseção e resolução de desigualdades.",topics:["Aberto e fechado","Intervalos mistos","União","Interseção","Desigualdades","Inequações simples"],lesson:`<p>Intervalo representa todos os números entre dois limites.</p>
<div class="formula">(a,b) → a &lt; x &lt; b<br>[a,b] → a ≤ x ≤ b<br>[a,b) → a ≤ x &lt; b<br>(a,b] → a &lt; x ≤ b</div>
<p><b>Regra visual:</b> parêntese = extremo não entra. Colchete = extremo entra.</p>
<h3>Como executar a conta</h3><p>Exemplo: 2x + 4 &gt; 10.<br>2x &gt; 6 → x &gt; 3.<br>Resposta: <b>(3,+∞)</b>.</p>
<p>Se multiplicar ou dividir uma desigualdade por número negativo, <b>inverta o sinal</b>.</p>`},
{id:3,title:"Função Constante e Identidade",desc:"Base para entender gráficos e funções.",topics:["f(x)=c","f(x)=x","Domínio","Imagem","Gráfico"],lesson:`<p><b>Função constante:</b> f(x)=c. O resultado é sempre o mesmo.</p><div class="formula">f(x)=5 → f(1)=5, f(100)=5</div><p>Seu gráfico é uma reta horizontal.</p><p><b>Função identidade:</b> f(x)=x. Cada entrada retorna ela mesma. Seu gráfico é a reta y=x.</p>`},
{id:4,title:"Função Afim",desc:"f(x)=ax+b, raiz, coeficientes e gráfico.",topics:["Coeficiente angular","Coeficiente linear","Raiz","Crescimento","Gráfico"],lesson:`<div class="formula">f(x)=ax+b</div><p><b>a</b> indica a inclinação. <b>b</b> é onde a reta corta o eixo y.</p><p>Para achar a raiz, faça f(x)=0:</p><div class="formula">ax+b=0 → x=−b/a</div><h3>Exemplo</h3><p>f(x)=2x−6 → 2x−6=0 → x=3.</p>`},
{id:5,title:"Função Linear",desc:"Caso especial da função afim.",topics:["f(x)=ax","Origem","Proporcionalidade","Gráfico"],lesson:`<div class="formula">f(x)=ax</div><p>É uma função afim com b=0. Portanto, seu gráfico passa pela origem (0,0).</p><p>Exemplo: f(x)=3x. Se x=4, então f(4)=12.</p>`},
{id:6,title:"Função Quadrática",desc:"Parábola, raízes, vértice, discriminante e gráfico.",topics:["ax²+bx+c","Δ","Bhaskara","Vértice","Concavidade"],lesson:`<div class="formula">f(x)=ax²+bx+c, a≠0<br>Δ=b²−4ac<br>x=(−b±√Δ)/(2a)</div><p>Se a&gt;0, a parábola tem concavidade para cima. Se a&lt;0, para baixo.</p><p>O vértice pode ser encontrado por:</p><div class="formula">xv=−b/(2a), &nbsp; yv=f(xv)</div><p>Se Δ&gt;0 há duas raízes reais; Δ=0 uma raiz real; Δ&lt;0 nenhuma raiz real.</p>`},
{id:7,title:"Função Exponencial",desc:"Potências, crescimento e decaimento.",topics:["a^x","Base","Crescimento","Decaimento","Equações"],lesson:`<div class="formula">f(x)=a^x, a&gt;0 e a≠1</div><p>Se a&gt;1, a função cresce. Se 0&lt;a&lt;1, decresce.</p><p>Exemplo: 2^3=8. Em equações com mesma base, compare os expoentes: 2^x=2^5 → x=5.</p>`},
{id:8,title:"Função Logarítmica",desc:"Logaritmos como operação inversa da exponencial.",topics:["Definição","Propriedades","Equações","Domínio","Gráfico"],lesson:`<div class="formula">logₐ(x)=y ⇔ a^y=x</div><p>Condições: a&gt;0, a≠1 e x&gt;0.</p><h3>Propriedades principais</h3><div class="formula">logₐ(xy)=logₐx+logₐy<br>logₐ(x/y)=logₐx−logₐy<br>logₐ(x^k)=k·logₐx</div><p>Exemplo: log₂(8)=3 porque 2³=8.</p>`},
{id:9,title:"Noções Intuitivas de Limite",desc:"A ideia de aproximar-se de um valor.",topics:["Limite","Aproximação","Limite lateral","Continuidade"],lesson:`<p>Limite pergunta: <b>“Para qual valor f(x) está se aproximando quando x se aproxima de um número?”</b></p><div class="formula">lim(x→a) f(x)</div><p>Exemplo: se f(x)=x+2, quando x→3, f(x)→5.</p><p>Em funções simples, muitas vezes basta substituir x por a. Em expressões que geram 0/0, são necessárias técnicas como fatoração e simplificação.</p>`},
{id:10,title:"Revisão de Cálculo 1",desc:"Mistura dos conteúdos estudados.",topics:["Classificação","Intervalos","Funções","Equações","Limites"],lesson:`<p>Use esta revisão para conectar os assuntos. Primeiro identifique o tipo de problema; depois escolha a regra adequada.</p><ol><li>Classifique números.</li><li>Resolva desigualdades e escreva intervalos.</li><li>Identifique o tipo de função.</li><li>Resolva raízes/valores.</li><li>Calcule limites simples.</li></ol>`}
];
const qs=[
["Conjuntos","Classifique −3/5 no menor conjunto.","Q","Z","I","R"],
["Conjuntos","Qual é o menor conjunto de √2?","I","N","Z","Q"],
["Conjuntos","√25 pertence ao menor conjunto:","N","Z","Q","I"],
["Intervalos","Resolva 2x+4>10.","x>3","x<3","x≥3","x≤3"],
["Intervalos","Qual intervalo representa 1≤x<5?","[1,5)","(1,5)","[1,5]","(1,5]"],
["Função Afim","A raiz de f(x)=2x−6 é:","3","−3","6","−6"],
["Linear","Em f(x)=4x, f(3)=:","12","7","1","4"],
["Quadrática","Para f(x)=x²−5x+6, as raízes são:","2 e 3","1 e 6","−2 e −3","0 e 6"],
["Exponencial","Quanto é 2³?","8","6","9","5"],
["Logaritmo","log₂(8) =","3","2","4","8"],
["Limite","lim(x→3)(x+2) =","5","3","2","6"]
];
const rules=[
["Conjuntos","N ⊂ Z ⊂ Q ⊂ R","Naturais estão nos inteiros; inteiros nos racionais; racionais nos reais."],
["Conjuntos","I ⊂ R","Irracionais são reais e não podem ser escritos como fração de inteiros."],
["Intervalos","(a,b)","Os extremos não pertencem ao intervalo."],
["Intervalos","[a,b]","Os extremos pertencem ao intervalo."],
["Intervalos","[a,b)","a entra; b não entra."],
["Intervalos","(a,b]","a não entra; b entra."],
["Intervalos","−2x>6 → x<−3","Ao multiplicar ou dividir uma desigualdade por negativo, inverta o sinal."],
["Função Afim","f(x)=ax+b","a é o coeficiente angular e b é o coeficiente linear."],
["Função Afim","x=−b/a","Raiz da função afim, fazendo f(x)=0."],
["Linear","f(x)=ax","É uma função afim com b=0 e passa pela origem."],
["Quadrática","Δ=b²−4ac","Discriminante da função quadrática."],
["Quadrática","x=(−b±√Δ)/(2a)","Fórmula de Bhaskara."],
["Quadrática","xv=−b/(2a)","Coordenada x do vértice."],
["Exponencial","f(x)=aˣ","a>0 e a≠1."],
["Exponencial","a>1 → crescente","A função cresce quando a base é maior que 1."],
["Exponencial","0<a<1 → decrescente","A função decresce quando a base está entre 0 e 1."],
["Logaritmo","logₐ(x)=y ⇔ aʸ=x","Logaritmo e exponencial são operações inversas."],
["Logaritmo","logₐ(xy)=logₐx+logₐy","Produto vira soma."],
["Logaritmo","logₐ(x/y)=logₐx−logₐy","Quociente vira subtração."],
["Limite","lim(x→a)f(x)","Pergunta para qual valor a função se aproxima quando x se aproxima de a."]
];
const extra=[["Conjuntos","Qual é o menor conjunto de 0?","N","Z","Q","R"],["Conjuntos","Qual é o menor conjunto de −8?","Z","N","Q","I"],["Conjuntos","Qual é o menor conjunto de π?","I","Q","Z","N"],["Intervalos","Qual intervalo representa −2<x≤4?","(−2,4]","[−2,4)","(−2,4)","[−2,4]"],["Intervalos","Se −3x<9, então:","x>−3","x<−3","x>3","x<3"],["Função Afim","Em f(x)=−2x+5, o coeficiente angular é:","−2","2","5","−5"],["Linear","Qual função é linear?","f(x)=4x","f(x)=4x+1","f(x)=x²","f(x)=4"],["Quadrática","Se Δ=0, a função possui:","uma raiz real","duas raízes reais","nenhuma raiz real","três raízes"],["Exponencial","2ˣ=16. Então x é:","4","2","8","16"],["Logaritmo","log₁₀(1000)=?","3","2","10","100"],["Limite","lim(x→2)(3x+1)=?","7","6","5","4"]];
const all=[...qs,...extra];let S=JSON.parse(localStorage.getItem("c1")||'{"done":[],"xp":0,"score":0,"streak":0,"errors":[],"last":"","hp":5}'),cur=[],subject="",ar=[],ci=0,flip=0;
const sm={"Conjuntos Numéricos":["Conjuntos"],"Intervalos":["Intervalos"],"Função Afim":["Função Afim"],"Função Linear":["Linear"],"Função Quadrática":["Quadrática"],"Função Exponencial":["Exponencial"],"Função Logarítmica":["Logaritmo"],"Limites":["Limite"]};
function save(){localStorage.setItem("c1",JSON.stringify(S));top()}function top(){st.textContent=S.streak;xp.textContent=S.xp;hp.textContent=S.hp}function theme(){localStorage.setItem("c1theme",document.body.classList.toggle("dark")?"dark":"light");th.textContent=document.body.classList.contains("dark")?"☀️":"🌙"}function toast(x){let e=document.createElement("div");e.className="toast";e.textContent=x;document.body.append(e);setTimeout(()=>e.remove(),1400)}
function day(){let d=new Date().toISOString().slice(0,10);if(S.last!==d){S.streak=S.last?((new Date(d)-new Date(S.last))/86400000===1?S.streak+1:1):1;S.last=d;S.hp=5;save()}}
function home(){day();let p=Math.round(S.done.length/modules.length*100);app.innerHTML=`<div class="card hero"><span class="tag">Sua jornada</span><h2>Vamos continuar? 🚀</h2><p class="muted">Pequenas lições, prática e revisão até dominar Cálculo 1.</p><div class="progress"><div class="bar" style="width:${p}%"></div></div><p class="muted"><b>${p}%</b> concluído</p><button onclick="lessons()">Continuar →</button></div><div class="grid"><div class="metric">🔥<b>${S.streak}</b><span class="muted">dias seguidos</span></div><div class="metric">⭐<b>${S.xp}</b><span class="muted">XP</span></div><div class="metric">🎯<b>${S.score}</b><span class="muted">acertos</span></div><div class="metric">📚<b>${S.done.length}/${modules.length}</b><span class="muted">módulos</span></div></div><div class="card"><span class="tag">Atalhos</span><h3>Escolha seu próximo passo</h3><button onclick="practiceMenu()" class="blue">✏️ Praticar</button><button onclick="cardsMenu()" class="yellow">🃏 Memorizar</button><button onclick="errors()" class="red">🔄 Meus erros</button></div><div class="card"><span class="tag">Desafio</span><h3>📝 Simulado</h3><p class="muted">10 questões misturadas de Cálculo 1.</p><button onclick="start('Global',10)">Começar simulado</button></div>`}
function lessons(){let p=Math.round(S.done.length/modules.length*100);app.innerHTML=`<div class="card hero"><span class="tag">Trilha</span><h2>🗺️ Sua jornada</h2><p class="muted">Avance passo a passo. Módulos concluídos ficam marcados.</p><div class="progress"><div class="bar" style="width:${p}%"></div></div></div><div class="path">${modules.map((m,i)=>{let d=S.done.includes(m.id),u=i===0||S.done.includes(modules[i-1].id);return `<div class="node ${d?"done":""} ${u?"active":"locked"}" ${u?`onclick="lesson(${m.id})"`:""}><div class="circle">${d?"✓":u?"▶":"🔒"}</div><div class="nodeinfo"><strong>${m.id}. ${m.title}</strong><small>${d?"Concluído • revisar":m.desc}</small></div></div>`}).join("")}</div>`}
function lesson(id){let m=modules.find(x=>x.id===id);app.innerHTML=`<div class="card"><span class="tag">Módulo ${m.id} • Aula</span><h2>${m.title}</h2><div class="card"><b>🎯 Objetivo</b><p class="muted">${m.desc}</p></div><div class="card"><b>🧠 Você vai aprender</b><ul>${m.topics.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="card"><b>📖 Explicação</b>${m.lesson}</div><button onclick="start('${m.title.replace(/'/g,"\'")}',7)">✏️ Praticar esta matéria</button><button class="alt" onclick="finish(${id})">✓ Concluir +20 XP</button></div>`}
function finish(id){if(!S.done.includes(id)){S.done.push(id);S.xp+=20;save();toast("+20 XP 🎉")}lessons()}
function practiceMenu(){app.innerHTML=`<div class="card hero"><span class="tag">Treino</span><h2>✏️ Escolha uma matéria</h2><p class="muted">Ou use Global para misturar tudo.</p></div>`+Object.keys(sm).map(x=>`<div class="card"><h3>📚 ${x}</h3><button onclick="start('${x.replace(/'/g,"\'")}',7)">Começar →</button></div>`).join("")+`<div class="card"><h3>🌐 Global</h3><p class="muted">Todas as matérias.</p><button onclick="start('Global',10)">Treino global →</button></div>`}
function start(sub,n){subject=sub;let pool=sub==="Global"?all:all.filter(q=>(sm[sub]||[]).includes(q[0]));if(pool.length<2)pool=all;cur=[...pool].sort(()=>Math.random()-.5).slice(0,n);S.hp=5;save();question(0)}
function question(i){if(i>=cur.length){S.xp+=20;save();app.innerHTML=`<div class="card hero"><span class="tag">Treino concluído</span><h2>🎉 Muito bem!</h2><p>Você terminou <b>${subject}</b>.</p><button onclick="practiceMenu()">Outro treino</button><button class="alt" onclick="home()">Início</button></div>`;return}let q=cur[i];app.innerHTML=`<div class="card"><span class="tag">${subject} • ${i+1}/${cur.length}</span><div class="progress"><div class="bar" style="width:${i/cur.length*100}%"></div></div><p>❤️ ${S.hp} &nbsp; ⭐ +10 XP</p><h2>${q[1]}</h2>${q.slice(2).map((o,j)=>`<button class="option" onclick="ans(this,${i},'${o.replace(/'/g,"\'")}')">${String.fromCharCode(65+j)}) ${o}</button>`).join("")}<div id="fb"></div></div>`}
function ans(b,i,v){if(document.body.dataset.answered)return;document.body.dataset.answered=1;let q=cur[i],ok=v===q[2];document.querySelectorAll(".option").forEach(x=>{if(x.textContent.includes(q[2]))x.classList.add("correct")});b.classList.add(ok?"correct":"wrong");if(ok){S.score++;S.xp+=10;fb.innerHTML=`<div class="card"><b>🎉 Correto!</b><br>+10 XP<button onclick="next(${i})">Próxima →</button></div>`}else{S.hp=Math.max(0,S.hp-1);S.errors.push({q:q[1],a:q[2],s:q[0]});fb.innerHTML=`<div class="card"><b>💡 Aprenda com o erro</b><p>Resposta correta: <b>${q[2]}</b></p><button onclick="next(${i})">Entendi →</button></div>`}save();delete document.body.dataset.answered}
function next(i){question(i+1)}
function cardsMenu(){app.innerHTML=`<div class="card hero"><span class="tag">Memorização</span><h2>🃏 Cartões</h2><p class="muted">Escolha uma matéria ou revise tudo.</p><button class="yellow" onclick="cards('Global')">🌐 Todas</button></div>`+Object.keys(sm).map(x=>`<div class="card"><h3>📚 ${x}</h3><button onclick="cards('${x}')">Ver cartões →</button></div>`).join("")}
function cards(s){ar=s==="Global"?rules:rules.filter(r=>(sm[s]||[]).includes(r[0]));if(!ar.length)ar=rules;ci=0;flip=0;card()}
function card(){let r=ar[ci];app.innerHTML=`<div class="card"><span class="tag">🃏 ${ci+1}/${ar.length}</span><h2>Memorize a regra</h2><div class="flash" onclick="flipCard()">${flip?r[2]:r[1]}<small>${flip?"Toque para voltar":"Toque para explicar"}</small></div><p class="muted" style="text-align:center">${r[0]}</p><button onclick="ci=(ci-1+ar.length)%ar.length;flip=0;card()">←</button><button onclick="ci=(ci+1)%ar.length;flip=0;card()">Próximo →</button><button class="alt" onclick="cardsMenu()">Matérias</button></div>`}function flipCard(){flip=flip?0:1;card()}
function errors(){let e=S.errors.slice(-30).reverse();app.innerHTML=`<div class="card hero"><span class="tag">Revisão</span><h2>🔄 Meus erros</h2><p class="muted">Use os erros como material de estudo.</p></div>`+(e.length?e.map(x=>`<div class="card"><span class="tag">${x.s}</span><h3>${x.q}</h3><p>Resposta correta: <b>${x.a}</b></p></div>`).join(""):`<div class="card"><h3>🎉 Nenhum erro salvo!</h3></div>`)}
function progress(){let p=Math.round(S.done.length/modules.length*100);app.innerHTML=`<div class="card hero"><span class="tag">Evolução</span><h2>📊 Seu progresso</h2><div class="progress"><div class="bar" style="width:${p}%"></div></div><p><b>${p}%</b> concluído</p></div><div class="grid"><div class="metric">🔥<b>${S.streak}</b><span class="muted">dias</span></div><div class="metric">⭐<b>${S.xp}</b><span class="muted">XP</span></div><div class="metric">🎯<b>${S.score}</b><span class="muted">acertos</span></div><div class="metric">❌<b>${S.errors.length}</b><span class="muted">erros</span></div></div><div class="card"><h3>Checklist</h3>${modules.map(m=>`<p>${S.done.includes(m.id)?"✅":"⬜"} ${m.title}</p>`).join("")}</div><button class="red" onclick="errors()">🔄 Revisar erros</button>`}
day();home();if(localStorage.getItem("c1theme")==="dark")document.body.classList.add("dark");th.textContent=document.body.classList.contains("dark")?"☀️":"🌙";top();
</script></body></html>
