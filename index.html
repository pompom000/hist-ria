*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.58}header{position:sticky;top:0;z-index:20;background:#111827ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:13px 16px}.head{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:19px}.sub{font-size:11px;color:var(--muted)}main{max-width:1180px;margin:auto;padding:18px 16px 105px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}.hero{background:linear-gradient(145deg,#1f2937,#222a3d)}.module{display:flex;gap:13px;align-items:center}.icon{font-size:28px;width:52px;height:52px;border-radius:16px;background:#334155;display:grid;place-items:center;flex:none}h2{font-size:24px;margin:6px 0;line-height:1.2}h3{font-size:17px;margin:17px 0 7px;line-height:1.25}.tag{font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:900;color:#9aa8c0}.muted{color:var(--muted);font-size:13px}.progress{height:9px;background:#374151;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--green);border-radius:99px;transition:.4s}button{font:inherit;border:0;border-radius:12px;padding:11px 15px;margin:5px 5px 5px 0;font-weight:800;cursor:pointer;background:var(--green);color:#102000;box-shadow:0 3px 0 var(--greenD)}button:active{transform:translateY(2px);box-shadow:none}button.alt{background:#334155;color:#fff;box-shadow:0 3px 0 #1f2937}.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#172033f5;backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.nav button{background:transparent;box-shadow:none;color:#aeb8ca;font-size:10px;padding:5px 8px;margin:0;min-width:68px}.nav button.active{color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--surface2);border:1px solid var(--line);padding:13px;border-radius:14px}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--muted)}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#111827;border:1px solid #374151;border-left:4px solid var(--purple);padding:12px;border-radius:10px;overflow:auto;margin:10px 0}.step{background:#273449;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:7px 0}.tip{background:#17351b;border:1px solid #2c6833;padding:12px;border-radius:12px;color:#c9f7cf;margin:12px 0}.option{display:block;width:100%;text-align:left;background:#273449;color:#fff;border:1px solid #3a475c;box-shadow:none}.option.correct{background:#173b1c;border-color:var(--green)}.option.wrong{background:#431b22;border-color:#ff4b4b}.flash{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;border-radius:18px;background:linear-gradient(145deg,#5141a8,#7c5cff);font-size:22px;font-weight:900;cursor:pointer}.flash small{display:block;color:#e7e2ff;font-size:11px;margin-top:10px}.lesson-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.lesson-grid .card{margin:0}.wide{grid-column:1/-1}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.lesson-grid{grid-template-columns:1fr}}@media(max-width:500px){main{padding:12px 10px 100px}.card{padding:15px}.grid{grid-template-columns:1fr 1fr}.icon{width:46px;height:46px;font-size:24px}h2{font-size:21px}}
</style></head><body><header><div class='head'><div><div class='brand'>📘 Cálculo 1</div><div class='sub'>Aprenda • pratique • revise</div></div><div>🌙</div></div></header><main id='app'></main><div class='nav'><button id='n-home' onclick="go('home')">🏠<br>Início</button><button id='n-lessons' onclick="go('lessons')">📚<br>Aulas</button><button id='n-quiz' onclick="go('quizmenu')">✏️<br>Praticar</button><button id='n-cards' onclick="go('cardsmenu')">🃏<br>Cartões</button><button id='n-progress' onclick="go('progress')">🏆<br>Progresso</button></div><script>
const DATA={"modules": [{"title": "Conjuntos Numéricos", "icon": "🔢", "cat": "Fundamentos", "desc": "N, Z, Q, I e R; classificação de números", "lesson": "\n<h3>1. O que são conjuntos numéricos?</h3>\n<p>Conjuntos numéricos são grupos usados para organizar os números. A ideia mais importante para as provas é saber <b>em qual conjunto um número pertence</b> e, quando a questão pedir, encontrar o <b>menor conjunto</b>.</p>\n<div class=\"formula\">ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ &nbsp;&nbsp;&nbsp; e &nbsp;&nbsp;&nbsp; 𝕀 ⊂ ℝ</div>\n<h3>2. Naturais — ℕ</h3>\n<p>São os números usados para contar. Aqui vamos usar:</p><div class=\"formula\">ℕ = {0, 1, 2, 3, 4, ...}</div>\n<p>Exemplos: 0, 1, 7, 25. Eles não possuem parte decimal nem sinal negativo.</p>\n<h3>3. Inteiros — ℤ</h3>\n<div class=\"formula\">ℤ = {..., −3, −2, −1, 0, 1, 2, 3, ...}</div>\n<p>Contêm todos os naturais, os negativos e o zero.</p>\n<h3>4. Racionais — ℚ</h3>\n<p>São os números que podem ser escritos como uma fração de dois inteiros, com denominador diferente de zero.</p>\n<div class=\"formula\">ℚ = {a/b | a,b ∈ ℤ e b ≠ 0}</div>\n<p>Exemplos: 1/2, −3/5, 4, 0,25 e 0,333... . Todo inteiro é racional, porque −8 = −8/1.</p>\n<h3>5. Irracionais — 𝕀</h3>\n<p>Não podem ser escritos como uma fração de inteiros. Exemplos importantes: <b>√2, √3, π</b>.</p>\n<h3>6. Reais — ℝ</h3>\n<p>Os reais reúnem os racionais e os irracionais:</p><div class=\"formula\">ℝ = ℚ ∪ 𝕀</div>\n<h3>7. Como resolver uma questão de classificação?</h3>\n<p>Exemplo: <b>−8, 0, 4, −3/5, 2/7, √2, √25, π e 3,1415</b>.</p>\n<div class=\"step\"><b>−8:</b> é inteiro → menor conjunto ℤ.</div>\n<div class=\"step\"><b>0:</b> neste curso, 0∈ℕ → menor conjunto ℕ.</div>\n<div class=\"step\"><b>4:</b> natural → ℕ.</div>\n<div class=\"step\"><b>−3/5:</b> é fração de inteiros → ℚ.</div>\n<div class=\"step\"><b>2/7:</b> é fração de inteiros → ℚ.</div>\n<div class=\"step\"><b>√2:</b> não pode ser escrito como fração de inteiros → 𝕀.</div>\n<div class=\"step\"><b>√25=5:</b> a raiz é exata e resulta em natural → ℕ.</div>\n<div class=\"step\"><b>π:</b> irracional → 𝕀.</div>\n<div class=\"step\"><b>3,1415:</b> decimal finito → racional → ℚ.</div>\n<div class=\"tip\">💡 Regra rápida: decimal finito é racional; inteiro é racional; raiz exata pode cair em ℕ/ℤ/ℚ; √2 e π são irracionais.</div>\n"}, {"title": "Intervalos e Inequações", "icon": "↔️", "cat": "Fundamentos", "desc": "Representação, operações, inequações, domínios e análise de sinais", "lesson": "\n<h3>1. O que é um intervalo?</h3>\n<p>Um <b>intervalo</b> é um conjunto de números reais que contém todos os números entre dois valores.</p>\n<div class=\"formula\">2 ≤ x ≤ 5</div>\n<p>Isso significa que x pode ser 2, 2,1, 2,5, 3, 4,99, 5 e todos os outros números entre 2 e 5.</p>\n<p>Podemos representar a mesma informação de três formas: <b>desigualdade</b>, <b>intervalo</b> e <b>reta numérica</b>.</p>\n<div class=\"formula\">2 ≤ x ≤ 5 &nbsp;&nbsp; ⇔ &nbsp;&nbsp; [2,5]</div>\n<pre class=\"numberline\">──────●════════════●──────\n      2            5</pre>\n\n<h3>2. Os quatro tipos principais</h3>\n<div class=\"formula\">[a,b] → a ≤ x ≤ b<br>(a,b) → a &lt; x &lt; b<br>[a,b) → a ≤ x &lt; b<br>(a,b] → a &lt; x ≤ b</div>\n<p><b>Colchete = inclui o extremo.</b> <b>Parêntese = não inclui o extremo.</b></p>\n<h4>🟢 Intervalo fechado</h4>\n<div class=\"formula\">[2,5] → 2 ≤ x ≤ 5</div>\n<pre class=\"numberline\">────●════════════●────\n    2            5</pre>\n<p>2 e 5 pertencem ao intervalo.</p>\n<h4>🔵 Intervalo aberto</h4>\n<div class=\"formula\">(2,5) → 2 &lt; x &lt; 5</div>\n<pre class=\"numberline\">────○════════════○────\n    2            5</pre>\n<p>2 e 5 não pertencem.</p>\n<h4>🟡 Fechado à esquerda e aberto à direita</h4>\n<div class=\"formula\">[2,5) → 2 ≤ x &lt; 5</div>\n<pre class=\"numberline\">────●════════════○────\n    2            5</pre>\n<p>2 ✅ pertence; 5 ❌ não pertence.</p>\n<h4>🟠 Aberto à esquerda e fechado à direita</h4>\n<div class=\"formula\">(2,5] → 2 &lt; x ≤ 5</div>\n<pre class=\"numberline\">────○════════════●────\n    2            5</pre>\n<p>2 ❌ não pertence; 5 ✅ pertence.</p>\n\n<h3>3. 🧠 Regra mais importante</h3>\n<table class=\"study-table\"><tr><th>Símbolo</th><th>Significado</th></tr><tr><td>[</td><td>inclui</td></tr><tr><td>]</td><td>inclui</td></tr><tr><td>(</td><td>não inclui</td></tr><tr><td>)</td><td>não inclui</td></tr></table>\n<div class=\"tip\">💡 [2,8) significa: de 2 até 8, incluindo 2 e excluindo 8.</div>\n\n<h3>4. Como transformar desigualdade em intervalo</h3>\n<div class=\"step\"><b>2 ≤ x ≤ 7</b> → <b>[2,7]</b></div>\n<div class=\"step\"><b>2 &lt; x &lt; 7</b> → <b>(2,7)</b></div>\n<div class=\"step\"><b>2 ≤ x &lt; 7</b> → <b>[2,7)</b></div>\n<div class=\"step\"><b>2 &lt; x ≤ 7</b> → <b>(2,7]</b></div>\n\n<h3>5. Como transformar intervalo em desigualdade</h3>\n<p>Observe cada extremo e transforme colchete/parêntese no sinal correspondente.</p>\n<div class=\"step\"><b>[3,10)</b></div>\n<div class=\"step\">[3 → 3 entra → <b>x ≥ 3</b></div>\n<div class=\"step\">10) → 10 não entra → <b>x &lt; 10</b></div>\n<div class=\"formula\">Resposta: 3 ≤ x &lt; 10</div>\n\n<h3>6. Intervalos infinitos</h3>\n<p>Se a solução continua indefinidamente, usamos ∞. <b>Nunca usamos colchete com infinito</b>, porque infinito não é um número que possa pertencer ao intervalo.</p>\n<div class=\"formula\">x &gt; 3 → (3,+∞)<br>x ≥ 3 → [3,+∞)<br>x &lt; 3 → (−∞,3)<br>x ≤ 3 → (−∞,3]</div>\n<pre class=\"numberline\">──────○══════════════════════════&gt;\n      3</pre>\n<div class=\"tip\">⚠️ Nunca escreva [3,+∞] ou [−∞,3]. Os lados do infinito sempre usam parênteses.</div>\n\n<h3>7. Todos os números reais</h3>\n<div class=\"formula\">x ∈ ℝ → (−∞,+∞)</div>\n<p>Isso representa todos os números reais.</p>\n\n<h3>8. Intervalo vazio</h3>\n<p>Quando nenhuma quantidade satisfaz a condição, temos o <b>conjunto vazio</b>.</p>\n<div class=\"step\">x &gt; 5 e x &lt; 2 → não existe solução</div>\n<div class=\"formula\">∅</div>\n\n<h3>9. União de intervalos</h3>\n<p>O símbolo <b>∪</b> significa união: juntamos os números que pertencem a pelo menos um dos intervalos.</p>\n<div class=\"formula\">[1,3] ∪ [5,8]</div>\n<pre class=\"numberline\">────●════●──────●════════●────\n    1    3      5        8</pre>\n<p>Leia como: números entre 1 e 3 <b>OU</b> entre 5 e 8.</p>\n\n<h3>10. Interseção de intervalos</h3>\n<p>O símbolo <b>∩</b> significa interseção: ficamos somente com a parte comum aos dois intervalos.</p>\n<div class=\"formula\">[1,6] ∩ [4,9] = [4,6]</div>\n<p>Uma forma de lembrar:</p>\n<div class=\"formula\">∪ = juntar &nbsp;&nbsp;&nbsp; ∩ = parte em comum</div>\n\n<h3>11. Intervalos e inequações</h3>\n<p>Para resolver, faça a conta normalmente e depois transforme a resposta em intervalo.</p>\n<h4>Exemplo 1</h4>\n<div class=\"step\">x + 3 &gt; 7</div><div class=\"step\">x &gt; 4</div>\n<div class=\"formula\">x ∈ (4,+∞)</div>\n<h4>Exemplo 2</h4>\n<div class=\"step\">2x − 4 ≤ 6</div><div class=\"step\">2x ≤ 10</div><div class=\"step\">x ≤ 5</div>\n<div class=\"formula\">x ∈ (−∞,5]</div>\n\n<h3>12. ⚠️ Regra extremamente importante: número negativo</h3>\n<p>Ao multiplicar ou dividir uma inequação por um número <b>negativo</b>, o sinal da desigualdade muda.</p>\n<div class=\"step\">−2x &gt; 6</div><div class=\"step\">x &lt; −3 &nbsp; ← o sinal mudou!</div>\n<div class=\"formula\">x ∈ (−∞,−3)</div>\n<div class=\"tip\">🧠 Decore: <b>dividiu ou multiplicou por negativo → inverte o sinal.</b></div>\n\n<h3>13. Inequações do segundo grau</h3>\n<p>Os intervalos também servem para representar soluções de expressões quadráticas.</p>\n<div class=\"step\">x² − 5x + 6 &gt; 0</div>\n<div class=\"step\">(x − 2)(x − 3) &gt; 0</div>\n<p>Os pontos críticos são <b>x = 2</b> e <b>x = 3</b>. Eles dividem a reta em:</p>\n<div class=\"formula\">(−∞,2) &nbsp;&nbsp; (2,3) &nbsp;&nbsp; (3,+∞)</div>\n<pre class=\"numberline\">───────○═══════○═══════&gt;\n       2       3</pre>\n<p>Os sinais são <b>+</b>, <b>−</b>, <b>+</b>. Como queremos &gt; 0, pegamos as regiões positivas:</p>\n<div class=\"formula\">x ∈ (−∞,2) ∪ (3,+∞)</div>\n<h4>Quando aparece ≥ ou ≤</h4>\n<div class=\"step\">x² − 5x + 6 ≥ 0</div>\n<p>Como agora os pontos onde a expressão vale zero também entram:</p>\n<div class=\"formula\">x ∈ (−∞,2] ∪ [3,+∞)</div>\n<div class=\"tip\">💡 &gt; e &lt; deixam as raízes de fora. ≥ e ≤ incluem as raízes.</div>\n\n<h3>14. Intervalos no domínio de funções</h3>\n<p>Essa parte é muito importante em Cálculo 1.</p>\n<h4>Fração: não pode dividir por zero</h4>\n<div class=\"step\">f(x) = 1/(x−3)</div><div class=\"step\">x − 3 ≠ 0</div><div class=\"step\">x ≠ 3</div>\n<div class=\"formula\">Domínio: (−∞,3) ∪ (3,+∞)</div>\n<h4>Raiz quadrada: radicando deve ser ≥ 0</h4>\n<div class=\"step\">f(x) = √(x−2)</div><div class=\"step\">x − 2 ≥ 0</div><div class=\"step\">x ≥ 2</div>\n<div class=\"formula\">Domínio: [2,+∞)</div>\n<h4>Outro exemplo</h4>\n<div class=\"step\">f(x) = √(5−x)</div><div class=\"step\">5 − x ≥ 0</div><div class=\"step\">−x ≥ −5</div><div class=\"step\">x ≤ 5</div>\n<div class=\"formula\">Domínio: (−∞,5]</div>\n\n<h3>15. Intervalos limitados e ilimitados</h3>\n<div class=\"step\"><b>Limitado:</b> tem início e fim, como [2,8].</div>\n<div class=\"step\"><b>Ilimitado:</b> continua indefinidamente, como [2,+∞).</div>\n\n<h3>16. Intervalo degenerado</h3>\n<p>Quando os dois extremos são iguais:</p>\n<div class=\"formula\">[5,5] = {5}</div>\n<p>Há apenas um número. Já:</p>\n<div class=\"formula\">(5,5) = ∅</div>\n\n<h3>17. Como interpretar rapidamente</h3>\n<div class=\"formula\">[a,b] → a entra, b entra<br>(a,b) → a não entra, b não entra<br>[a,b) → a entra, b não entra<br>(a,b] → a não entra, b entra</div>\n<h3>🧠 Resumo para decorar</h3>\n<div class=\"formula\">[a,b] → a ≤ x ≤ b<br>(a,b) → a &lt; x &lt; b<br>[a,b) → a ≤ x &lt; b<br>(a,b] → a &lt; x ≤ b<br>(−∞,a) &nbsp; (−∞,a] &nbsp; (a,+∞) &nbsp; [a,+∞)</div>\n<div class=\"tip\">🎯 Para resolver exercícios: 1) resolva a inequação; 2) marque os pontos críticos na reta; 3) decida quais extremos entram; 4) escreva o intervalo; 5) se houver mais de uma região, use ∪.</div>\n"}, {"title": "Funções: fundamentos, constante e identidade", "icon": "📈", "cat": "Funções", "desc": "Produto cartesiano, relações, domínio, imagem e funções básicas", "lesson": "\n<h3>1. O que é uma função?</h3>\n<p>Uma função é uma relação em que cada elemento do domínio está associado a <b>uma única saída</b>.</p>\n<div class=\"formula\">y = f(x)</div>\n<h3>2. Pares ordenados e produto cartesiano</h3>\n<p>Um par ordenado é escrito como (x,y). O produto cartesiano A×B reúne todos os pares (a,b), com a∈A e b∈B.</p>\n<h3>3. Relação e função</h3>\n<p>Uma relação pode associar elementos de duas formas. Para ser função, cada entrada deve possuir somente uma saída.</p>\n<h3>4. Domínio, contradomínio e imagem</h3>\n<div class=\"step\"><b>Domínio:</b> valores que podem entrar.</div>\n<div class=\"step\"><b>Contradomínio:</b> conjunto de chegada.</div>\n<div class=\"step\"><b>Imagem:</b> valores que realmente aparecem como saída.</div>\n<h3>5. Notação</h3><div class=\"formula\">f: A → B<br>x ↦ f(x)</div>\n<p>Quando aparece f(3), substituímos x por 3.</p>\n<h3>6. Função constante</h3><div class=\"formula\">f(x)=c</div>\n<p>A saída não muda. Ex.: f(x)=5 → f(1)=5 e f(100)=5. O gráfico é uma reta horizontal.</p>\n<h3>7. Função identidade</h3><div class=\"formula\">f(x)=x</div>\n<p>A saída é igual à entrada. Seu gráfico é y=x e passa pela origem.</p>\n<h3>8. Como calcular valor</h3><p>Se f(x)=2x+4 e x=3:</p><div class=\"formula\">f(3)=2·3+4=10</div>\n<div class=\"tip\">💡 Primeiro identifique o que a questão está pedindo: domínio, imagem, valor, raiz ou gráfico. Isso evita escolher uma fórmula errada.</div>\n"}, {"title": "Função Afim", "icon": "📏", "cat": "Funções", "desc": "f(x)=ax+b, coeficientes, raiz, gráfico e crescimento", "lesson": "\n<h3>1. Forma geral</h3><div class=\"formula\">f(x)=ax+b</div>\n<p><b>a</b> é o coeficiente angular e <b>b</b> é o coeficiente linear.</p>\n<h3>2. Significado de a</h3><p>a mede a inclinação da reta. Se a&gt;0, a função é crescente. Se a&lt;0, é decrescente. Se a=0, vira constante.</p>\n<h3>3. Significado de b</h3><p>b é o valor de f(0), portanto indica onde a reta corta o eixo y.</p>\n<h3>4. Raiz da função</h3><p>A raiz é o x para o qual a função vale zero.</p><div class=\"formula\">ax+b=0 → x=−b/a</div>\n<p>Ex.: f(x)=2x−6 → 2x−6=0 → x=3.</p>\n<h3>5. Gráfico</h3><p>Você pode encontrar dois pontos. Um ponto muito fácil é (0,b). Outro pode ser a raiz.</p>\n<h3>6. Taxa de variação</h3><div class=\"formula\">a = (y₂−y₁)/(x₂−x₁)</div>\n<p>Ela indica quanto y varia quando x aumenta uma unidade.</p>\n<h3>7. Exemplo completo</h3><p>Para f(x)=2x+4: f(0)=4; raiz: 2x+4=0 → x=−2; como a=2&gt;0, a função é crescente.</p>\n"}, {"title": "Função Linear", "icon": "➗", "cat": "Funções", "desc": "f(x)=ax, proporcionalidade e gráfico", "lesson": "\n<h3>1. Forma</h3><div class=\"formula\">f(x)=ax</div>\n<p>É uma função afim com <b>b=0</b>. Por isso passa obrigatoriamente pela origem (0,0).</p>\n<h3>2. Coeficiente angular</h3><p>O número a determina a inclinação.</p>\n<p>Ex.: f(x)=3x → a=3 → f(4)=12.</p>\n<h3>3. Proporcionalidade direta</h3><p>Se duas grandezas são diretamente proporcionais, podemos escrever y=ax. A razão y/x permanece constante.</p>\n<h3>4. Gráfico</h3><p>Em f(x)=3x: x=0 → y=0; x=1 → y=3; x=2 → y=6. Os pontos formam uma reta pela origem.</p>\n"}, {"title": "Função Quadrática", "icon": "⌒", "cat": "Funções", "desc": "Parábola, raízes, Δ, Bhaskara, vértice e gráfico", "lesson": "\n<h3>1. Forma geral</h3><div class=\"formula\">f(x)=ax²+bx+c, a≠0</div>\n<h3>2. Concavidade</h3><p>a&gt;0 → parábola abre para cima. a&lt;0 → abre para baixo.</p>\n<h3>3. Discriminante</h3><div class=\"formula\">Δ=b²−4ac</div>\n<div class=\"step\">Δ&gt;0 → duas raízes reais distintas.</div><div class=\"step\">Δ=0 → uma raiz real.</div><div class=\"step\">Δ&lt;0 → nenhuma raiz real.</div>\n<h3>4. Bhaskara</h3><div class=\"formula\">x = (−b ± √Δ)/(2a)</div>\n<p>Primeiro identifique a, b e c. Depois calcule Δ. Só então aplique a fórmula.</p>\n<h3>5. Vértice</h3><div class=\"formula\">xᵥ=−b/(2a)<br>yᵥ=f(xᵥ)</div>\n<p>O vértice é máximo quando a&lt;0 e mínimo quando a&gt;0.</p>\n<h3>6. Eixo de simetria</h3><div class=\"formula\">x=xᵥ</div>\n<h3>7. Roteiro de resolução</h3><p>Identifique a,b,c → calcule Δ → encontre as raízes → veja a concavidade → calcule o vértice → interprete o gráfico.</p>\n<h3>8. Exemplo</h3><p>f(x)=x²−5x+6. Aqui a=1,b=−5,c=6. Δ=25−24=1. As raízes são 2 e 3.</p>\n"}, {"title": "Função Exponencial", "icon": "⚡", "cat": "Funções", "desc": "Potências, crescimento, decaimento e equações", "lesson": "\n<h3>1. Forma</h3><div class=\"formula\">f(x)=aˣ, a&gt;0 e a≠1</div>\n<h3>2. Comportamento</h3><p>a&gt;1 → crescente. 0&lt;a&lt;1 → decrescente.</p>\n<h3>3. Regras de potências</h3><div class=\"formula\">aᵐ·aⁿ=aᵐ⁺ⁿ<br>aᵐ/aⁿ=aᵐ⁻ⁿ<br>(aᵐ)ⁿ=aᵐⁿ<br>a⁰=1<br>a⁻ⁿ=1/aⁿ</div>\n<h3>4. Equações exponenciais</h3><p>Quando as bases podem ficar iguais, compare os expoentes.</p><div class=\"formula\">2ˣ=2⁵ → x=5</div>\n<p>Exemplo: 4ˣ=16 → 4ˣ=4² → x=2.</p>\n<h3>5. Quando usar logaritmo?</h3><p>Se não for possível transformar as bases para uma forma comum, o logaritmo pode ser usado para “tirar” o x do expoente.</p>\n<h3>6. Aplicações</h3><p>Crescimento populacional, juros compostos, decaimento e processos em que a taxa depende do valor atual.</p>\n"}, {"title": "Função Logarítmica", "icon": "🧮", "cat": "Funções", "desc": "Definição, propriedades, equações e mudança de base", "lesson": "\n<h3>1. Definição</h3><div class=\"formula\">logₐ(x)=y ⇔ aʸ=x</div>\n<p>Condições: <b>a&gt;0, a≠1 e x&gt;0</b>.</p>\n<h3>2. Exemplos</h3><p>log₂(8)=3 porque 2³=8. log₁₀(1000)=3.</p>\n<h3>3. Valores importantes</h3><div class=\"formula\">logₐ(1)=0<br>logₐ(a)=1</div>\n<h3>4. Propriedades</h3><div class=\"formula\">logₐ(xy)=logₐx+logₐy<br>logₐ(x/y)=logₐx−logₐy<br>logₐ(xᵏ)=k·logₐx</div>\n<h3>5. Mudança de base</h3><div class=\"formula\">logₐ(b)=log_c(b)/log_c(a)</div>\n<h3>6. Equações logarítmicas</h3><p>Transforme entre forma logarítmica e exponencial. Depois confira o domínio: todo argumento de logaritmo deve ser positivo.</p>\n<h3>7. Relação com exponencial</h3><p>As duas funções são inversas: uma desfaz a operação da outra.</p>\n"}, {"title": "Limites: noções intuitivas, laterais e no infinito", "icon": "🎯", "cat": "Limites", "desc": "Aproximação, propriedades, 0/0, laterais, infinito e continuidade", "lesson": "\n<h3>1. Ideia intuitiva</h3><p>Limite pergunta para qual valor a função está se aproximando quando x se aproxima de determinado número.</p><div class=\"formula\">lim(x→a) f(x)</div>\n<p>Não estamos necessariamente perguntando quanto f(a) vale; estamos observando o comportamento perto de a.</p>\n<h3>2. Substituição direta</h3><p>Em funções contínuas, muitas vezes basta substituir x por a.</p><div class=\"formula\">lim(x→3)(x+2)=5</div>\n<h3>3. Limites laterais</h3><div class=\"formula\">lim(x→a⁻)f(x) → pela esquerda<br>lim(x→a⁺)f(x) → pela direita</div>\n<p>O limite bilateral existe quando os dois laterais chegam ao mesmo valor.</p>\n<h3>4. Propriedades básicas</h3><p>Se os limites existem, podemos somar, subtrair, multiplicar e dividir (desde que o denominador do limite não seja zero).</p>\n<h3>5. Forma 0/0</h3><p>0/0 é uma <b>indeterminação</b>. Não significa que o limite é zero. Uma técnica comum é fatorar e cancelar o fator responsável.</p>\n<div class=\"formula\">lim(x→2)(x²−4)/(x−2)<br>=lim(x→2)((x−2)(x+2))/(x−2)<br>=lim(x→2)(x+2)=4</div>\n<h3>6. Limite no infinito</h3><p>Estudamos o que acontece quando x cresce sem limite, como x→+∞ ou x→−∞. Em funções racionais, compare os graus e os termos dominantes.</p>\n<h3>7. Continuidade</h3><p>Intuitivamente, uma função contínua não apresenta “quebra” no ponto. Em a, a ideia é que o limite exista e coincida com f(a).</p>\n<div class=\"formula\">lim(x→a)f(x)=f(a)</div>\n<h3>8. Estratégia</h3><p>Substitua primeiro. Se aparecer 0/0, simplifique/fatore. Se houver lados diferentes, analise os limites laterais. Se x→∞, observe os termos dominantes.</p>\n"}, {"title": "Módulo Extra: Função Modular", "icon": "|x|", "cat": "Funções", "desc": "Módulo, distância e equações/inequações modulares", "lesson": "\n<h3>1. Definição</h3><div class=\"formula\">|x| = x, se x≥0<br>|x| = −x, se x&lt;0</div>\n<p>O módulo representa a distância de um número até zero, portanto nunca é negativo.</p>\n<h3>2. Exemplos</h3><div class=\"formula\">|5|=5<br>|−5|=5<br>|0|=0</div>\n<h3>3. Equação modular</h3><p>|x|=3 → x=3 ou x=−3.</p>\n<h3>4. Inequações</h3><div class=\"formula\">|x|&lt;3 → −3&lt;x&lt;3<br>|x|≤3 → −3≤x≤3<br>|x|&gt;3 → x&lt;−3 ou x&gt;3</div>\n<p>O módulo aparece em problemas de distância e também pode ser analisado por partes em gráficos.</p>\n"}, {"title": "Revisão Geral de Cálculo 1", "icon": "🏆", "cat": "Revisão", "desc": "Checklist e método para provas", "lesson": "\n<h3>Checklist completo</h3>\n<ol><li>Conjuntos numéricos e classificação.</li><li>Intervalos, união, interseção e inequações.</li><li>Pares ordenados, produto cartesiano, relações, domínio e imagem.</li><li>Funções constante e identidade.</li><li>Função afim e linear.</li><li>Função quadrática, Δ, Bhaskara e vértice.</li><li>Função exponencial e propriedades de potências.</li><li>Função logarítmica e suas propriedades.</li><li>Função modular.</li><li>Limites intuitivos, laterais, no infinito, 0/0 e continuidade.</li></ol>\n<h3>Método para qualquer questão</h3>\n<div class=\"step\"><b>1.</b> Identifique o assunto.</div><div class=\"step\"><b>2.</b> Separe os dados.</div><div class=\"step\"><b>3.</b> Escolha a definição ou fórmula.</div><div class=\"step\"><b>4.</b> Resolva linha por linha.</div><div class=\"step\"><b>5.</b> Confira sinais, domínio e se a resposta faz sentido.</div>\n<div class=\"tip\">💡 Em Cálculo 1, entender o procedimento é mais importante que decorar uma fórmula isolada. Depois de cada aula, pratique questões daquela matéria.</div>\n"}], "questions": [{"subject": "Conjuntos Numéricos", "q": "Qual é o menor conjunto de −3/5?", "opts": ["ℚ", "ℤ", "𝕀", "ℕ"], "answer": 0}, {"subject": "Conjuntos Numéricos", "q": "Qual é o menor conjunto de √2?", "opts": ["𝕀", "ℚ", "ℤ", "ℕ"], "answer": 0}, {"subject": "Conjuntos Numéricos", "q": "√25 pertence ao menor conjunto:", "opts": ["ℕ", "ℤ", "ℚ", "𝕀"], "answer": 0}, {"subject": "Conjuntos Numéricos", "q": "3,1415 é:", "opts": ["Racional", "Irracional", "Inteiro negativo", "Natural"], "answer": 0}, {"subject": "Intervalos e Inequações", "q": "Resolva 2x+4>10.", "opts": ["x>3", "x<3", "x≥3", "x≤3"], "answer": 0}, {"subject": "Intervalos e Inequações", "q": "Qual intervalo representa 1≤x<5?", "opts": ["[1,5)", "(1,5)", "[1,5]", "(1,5]"], "answer": 0}, {"subject": "Intervalos e Inequações", "q": "Se −3x<9, então:", "opts": ["x>−3", "x<−3", "x>3", "x<3"], "answer": 0}, {"subject": "Funções: fundamentos, constante e identidade", "q": "Qual é a função constante?", "opts": ["f(x)=c", "f(x)=x", "f(x)=ax+b", "f(x)=x²"], "answer": 0}, {"subject": "Função Afim", "q": "A raiz de 2x−6 é:", "opts": ["3", "−3", "6", "−6"], "answer": 0}, {"subject": "Função Afim", "q": "Em f(x)=−2x+5, o coeficiente angular é:", "opts": ["−2", "2", "5", "−5"], "answer": 0}, {"subject": "Função Linear", "q": "Em f(x)=4x, f(3) é:", "opts": ["12", "7", "1", "4"], "answer": 0}, {"subject": "Função Quadrática", "q": "Δ é:", "opts": ["b²−4ac", "b²+4ac", "2a+b", "−b/2a"], "answer": 0}, {"subject": "Função Quadrática", "q": "Se Δ<0, há:", "opts": ["nenhuma raiz real", "uma raiz real", "duas raízes reais", "três raízes"], "answer": 0}, {"subject": "Função Exponencial", "q": "2³ é:", "opts": ["8", "6", "9", "5"], "answer": 0}, {"subject": "Função Exponencial", "q": "Se a>1, aˣ é:", "opts": ["crescente", "decrescente", "constante", "negativa"], "answer": 0}, {"subject": "Função Logarítmica", "q": "log₂(8) é:", "opts": ["3", "2", "4", "8"], "answer": 0}, {"subject": "Função Logarítmica", "q": "O argumento de um logaritmo deve ser:", "opts": ["positivo", "negativo", "zero", "qualquer real"], "answer": 0}, {"subject": "Limites: noções intuitivas, laterais e no infinito", "q": "lim(x→3)(x+2) é:", "opts": ["5", "3", "2", "6"], "answer": 0}, {"subject": "Limites: noções intuitivas, laterais e no infinito", "q": "0/0 em um limite é:", "opts": ["indeterminação", "zero", "infinito", "limite inexistente"], "answer": 0}, {"subject": "Módulo Extra: Função Modular", "q": "|−5| é:", "opts": ["5", "−5", "0", "25"], "answer": 0}], "cards": [{"subject": "Conjuntos Numéricos", "front": "ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ", "back": "Naturais dentro dos inteiros, inteiros dentro dos racionais e racionais dentro dos reais."}, {"subject": "Conjuntos Numéricos", "front": "𝕀 ⊂ ℝ", "back": "Irracionais são reais que não são racionais."}, {"subject": "Intervalos e Inequações", "front": "(a,b)", "back": "Extremos não pertencem."}, {"subject": "Intervalos e Inequações", "front": "[a,b]", "back": "Extremos pertencem."}, {"subject": "Intervalos e Inequações", "front": "Dividiu por negativo? Inverta o sinal.", "back": "Regra essencial das inequações."}, {"subject": "Função Afim", "front": "f(x)=ax+b", "back": "a é coeficiente angular; b é coeficiente linear."}, {"subject": "Função Afim", "front": "x=−b/a", "back": "Raiz da função afim."}, {"subject": "Função Linear", "front": "f(x)=ax", "back": "Função afim com b=0; passa pela origem."}, {"subject": "Função Quadrática", "front": "Δ=b²−4ac", "back": "Discriminante da função quadrática."}, {"subject": "Função Quadrática", "front": "x=(−b±√Δ)/(2a)", "back": "Fórmula de Bhaskara."}, {"subject": "Função Quadrática", "front": "xᵥ=−b/(2a)", "back": "Coordenada x do vértice."}, {"subject": "Função Exponencial", "front": "a>1 → crescente", "back": "Base maior que 1 produz crescimento."}, {"subject": "Função Exponencial", "front": "0<a<1 → decrescente", "back": "Base entre 0 e 1 produz decaimento."}, {"subject": "Função Logarítmica", "front": "logₐ(x)=y ⇔ aʸ=x", "back": "Logaritmo e exponencial são inversas."}, {"subject": "Função Logarítmica", "front": "logₐ(xy)=logₐx+logₐy", "back": "Produto vira soma."}, {"subject": "Limites: noções intuitivas, laterais e no infinito", "front": "lim(x→a)f(x)", "back": "Valor para o qual a função se aproxima."}, {"subject": "Limites: noções intuitivas, laterais e no infinito", "front": "0/0 é indeterminação", "back": "Tente fatorar e simplificar."}, {"subject": "Módulo Extra: Função Modular", "front": "|x|≥0", "back": "Módulo representa distância até zero."}, {"subject": "Funções: fundamentos, constante e identidade", "front": "f(x)=c", "back": "Função constante."}, {"subject": "Funções: fundamentos, constante e identidade", "front": "f(x)=x", "back": "Função identidade."}]};
const modules=DATA.modules,questions=DATA.questions,cards=DATA.cards;
let state=JSON.parse(localStorage.getItem('calc1_state')||'{"done":[],"score":0,"streak":0}');
let quiz=[],cardList=cards,cardIndex=0,cardSide=false;
function save(){localStorage.setItem('calc1_state',JSON.stringify(state))}
function route(){let r=location.hash.slice(1)||localStorage.getItem('calc1_route')||'home';localStorage.setItem('calc1_route',r);render(r)}
function go(r){localStorage.setItem('calc1_route',r);location.hash=r;render(r);window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
function nav(a){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));let b=document.getElementById('n-'+a);if(b)b.classList.add('active')}
function render(r){if(r.startsWith('lesson-'))lesson(+r.split('-')[1]);else if(r.startsWith('quiz-'))startQuiz(decodeURIComponent(r.slice(5)));else if(r==='quizmenu')quizMenu();else if(r==='cardsmenu')cardsMenu();else if(r.startsWith('cards-'))startCards(decodeURIComponent(r.slice(6)));else if(r==='lessons')lessons();else if(r==='progress')progress();else home()}
function home(){nav('home');let p=Math.round(state.done.length/modules.length*100);app.innerHTML=`<div class="card hero"><span class="tag">Seu caminho</span><h2>Vamos estudar Cálculo 1? ✨</h2><p class="muted">Aulas completas, exemplos, fórmulas, exercícios e cartões.</p><div class="progress"><div class="bar" style="width:${p}%"></div></div><p class="muted"><b style="color:#fff">${p}%</b> concluído</p></div><div class="grid"><div class="stat"><b>📚 ${modules.length}</b><span>módulos</span></div><div class="stat"><b>✏️ ${questions.length}</b><span>questões</span></div><div class="stat"><b>🃏 ${cards.length}</b><span>cartões</span></div><div class="stat"><b>🔥 ${state.streak||0}</b><span>sequência</span></div></div><div class="lesson-grid"><div class="card"><span class="tag">Estudar</span><h3>📖 Aulas completas</h3><p class="muted">Todo o conteúdo do projeto está organizado por matéria.</p><button onclick="go('lessons')">Continuar →</button></div><div class="card"><span class="tag">Praticar</span><h3>✏️ Questões</h3><p class="muted">Treine por matéria ou misture tudo no modo Global.</p><button onclick="go('quizmenu')">Praticar →</button></div><div class="card wide"><span class="tag">Revisar</span><h3>🃏 Cartões</h3><p class="muted">Fórmulas e regras para memorizar.</p><button onclick="go('cardsmenu')">Abrir cartões →</button></div></div>`}
function lessons(){nav('lessons');app.innerHTML=`<div class="card hero"><span class="tag">Trilha completa</span><h2>📚 Matérias</h2><p class="muted">No computador, os conteúdos ocupam a largura disponível; no celular, viram uma coluna confortável.</p></div><div class="lesson-grid">${modules.map((m,i)=>`<div class="card"><div class="module"><div class="icon">${m.icon}</div><div><h3>${i+1}. ${m.title}</h3><div class="muted">${m.desc}</div></div></div><button onclick="go('lesson-${i}')">${state.done.includes(i)?'✓ Revisar':'Estudar'} →</button></div>`).join('')}</div>`}
function lesson(i){nav('lessons');let m=modules[i];app.innerHTML=`<div class="card hero"><div class="module"><div class="icon">${m.icon}</div><div><span class="tag">${m.cat}</span><h2>${m.title}</h2><div class="muted">${m.desc}</div></div></div></div><div class="card">${m.lesson}</div><div class="card"><button onclick="finish(${i})">${state.done.includes(i)?'✓ Concluído':'Marcar como concluído'}</button><button class="alt" onclick="go('quiz-${encodeURIComponent(m.title)}')">✏️ Praticar esta matéria</button><button class="alt" onclick="go('lessons')">← Matérias</button></div>`}
function finish(i){if(!state.done.includes(i)){state.done.push(i);state.streak=(state.streak||0)+1;save()}lesson(i)}
function quizMenu(){nav('quiz');let s=['Global',...modules.map(m=>m.title)];app.innerHTML=`<div class="card hero"><span class="tag">Treino</span><h2>✏️ Perguntas</h2><p class="muted">Escolha uma matéria ou misture todas.</p></div><div class="lesson-grid">${s.map((x,i)=>`<div class="card"><div class="module"><div class="icon">${i?'🧠':'🌐'}</div><div><h3>${x}</h3><div class="muted">${i?modules[i-1].desc:'Todas as matérias'}</div></div></div><button onclick="go('quiz-${encodeURIComponent(x)}')">Começar →</button></div>`).join('')}</div>`}
function startQuiz(subject){nav('quiz');let pool=subject==='Global'?questions:questions.filter(q=>q.subject===subject);quiz=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(10,pool.length));app.innerHTML=`<div class="card hero"><span class="tag">${subject}</span><h2>🎯 Treino</h2><p class="muted">${quiz.length} questões selecionadas.</p></div>`+quiz.map((q,i)=>`<div class="card"><span class="tag">${q.subject}</span><h3>${i+1}. ${q.q}</h3>${q.opts.map((o,j)=>`<button class="option" onclick="answer(this,${i},${j})">${String.fromCharCode(65+j)}) ${o}</button>`).join('')}<div id="r-${i}" class="muted"></div></div>`).join('')+`<div class="card"><button onclick="go('quizmenu')">← Escolher outra matéria</button></div>`}
function answer(btn,i,j){let box=btn.parentElement;if(box.dataset.done)return;box.dataset.done='1';let q=quiz[i],ok=j===q.answer;box.querySelectorAll('.option').forEach((b,k)=>{if(k===q.answer)b.classList.add('correct')});if(!ok)btn.classList.add('wrong');document.getElementById('r-'+i).textContent=ok?'✅ Correto!':'❌ A resposta correta está destacada.';if(ok)state.score=(state.score||0)+1;save()}
function cardsMenu(){nav('cards');let s=['Global',...modules.map(m=>m.title)];app.innerHTML=`<div class="card hero"><span class="tag">Memorização</span><h2>🃏 Cartões</h2><p class="muted">Regras e fórmulas de todas as matérias.</p></div><div class="lesson-grid">${s.map((x,i)=>`<div class="card"><div class="module"><div class="icon">${i?'🃏':'🌐'}</div><div><h3>${x}</h3><div class="muted">${i?'Regras e fórmulas':'Todas as regras'}</div></div></div><button onclick="go('cards-${encodeURIComponent(x)}')">Abrir →</button></div>`).join('')}</div>`}
function startCards(subject){nav('cards');cardList=subject==='Global'?cards:cards.filter(c=>c.subject===subject);cardIndex=0;cardSide=false;drawCard(subject)}
function drawCard(subject){let c=cardList[cardIndex];app.innerHTML=`<div class="card hero"><span class="tag">Cartões • ${subject}</span><h2>🃏 Memorize</h2><p class="muted">Toque no cartão para virar.</p><div class="flash" onclick="flip()">${cardSide?c.back:c.front}<small>${cardSide?'Toque para voltar à regra':'Toque para ver a explicação'}</small></div><p class="muted" style="text-align:center">${cardIndex+1} de ${cardList.length}</p><button onclick="prev()">←</button><button onclick="next()">Próximo →</button><button class="alt" onclick="go('cardsmenu')">Escolher matéria</button></div>`}
function flip(){cardSide=!cardSide;drawCard(cardList[cardIndex].subject)}function next(){cardIndex=(cardIndex+1)%cardList.length;cardSide=false;drawCard(cardList[cardIndex].subject)}function prev(){cardIndex=(cardIndex-1+cardList.length)%cardList.length;cardSide=false;drawCard(cardList[cardIndex].subject)}
function progress(){nav('progress');let p=Math.round(state.done.length/modules.length*100);app.innerHTML=`<div class="card hero"><span class="tag">Progresso</span><h2>🏆 ${p}% concluído</h2><div class="progress"><div class="bar" style="width:${p}%"></div></div></div><div class="grid"><div class="stat"><b>${state.done.length}/${modules.length}</b><span>módulos</span></div><div class="stat"><b>${state.score}</b><span>acertos</span></div><div class="stat"><b>${state.streak||0}</b><span>sequência</span></div><div class="stat"><b>${questions.length}</b><span>questões</span></div></div><div class="card"><h3>Trilha</h3>${modules.map((m,i)=>`<p>${state.done.includes(i)?'🟢':'⚪'} ${m.title}</p>`).join('')}</div>`}
route();
</script></body></html>
